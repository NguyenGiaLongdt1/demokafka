spring:
  application:
    name: demo

  datasource:
    url: jdbc:postgresql://localhost:5432/kafka_demo
    username: kafka_demo
    password: kafka_demo

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 5
    consumer:
      group-id: enterprise-demo
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

app:
  kafka:
    request-topic: order.request
    result-topic: order.result
    dead-letter-topic: order.result.dlt
  outbound:
    worker-enabled: true
    batch-size: 20
    max-retry: 5
    processing-timeout-seconds: 300
    retry-delays-seconds: 10,30,60,300,900
  jwt:
    # Secret rieng cho Access Token (HMAC-SHA256 toi thieu 256-bit)
    access-secret: 9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
    # Thoi gian het han Access Token: 15 phut (900000 ms)
    access-expiration-ms: 900000

    # Secret rieng cho Refresh Token (HMAC-SHA256 toi thieu 256-bit)
    refresh-secret: 1f2e3d4c5b6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c
    # Thoi gian het han Refresh Token: 7 ngay (604800000 ms)
    refresh-expiration-ms: 604800000

logging:
  file:
    name: demo.log